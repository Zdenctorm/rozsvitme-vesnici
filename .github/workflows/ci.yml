name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    # Runs only when the Cloudflare secrets exist; otherwise every step is skipped.
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Cloudflare secrets missing, skipping deploy
        if: env.HAS_CF != 'true'
        run: echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set, see docs/deploy.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CF == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_CF == 'true'
      - uses: actions/download-artifact@v4
        if: env.HAS_CF == 'true'
        with:
          name: dist
          path: dist

      - name: Deploy production
        if: env.HAS_CF == 'true' && github.event_name == 'push'
        run: npx wrangler deploy

      - name: Upload PR preview
        if: env.HAS_CF == 'true' && github.event_name == 'pull_request'
        id: preview
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" | tee wrangler.log
          url=$(grep -oE 'https://pr-[0-9]+-[^ ]+\.workers\.dev' wrangler.log | head -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: env.HAS_CF == 'true' && github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --edit-last --create-if-none \
            --body "Preview: ${{ steps.preview.outputs.url }}"
